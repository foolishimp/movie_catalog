<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Media Catalog{% endblock %}</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a2e;
            --surface2: #16213e;
            --accent: #e94560;
            --accent2: #0f3460;
            --text: #eee;
            --text-dim: #999;
            --border: #333;
            --green: #4ecca3;
            --yellow: #ffd369;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        nav {
            background: var(--surface);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .logo { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        nav a { color: var(--text-dim); font-size: 0.95rem; }
        nav a:hover, nav a.active { color: var(--text); text-decoration: none; }

        .search-bar {
            margin-left: auto;
            display: flex;
            gap: 0.5rem;
        }
        .search-bar input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 280px;
        }
        .search-bar button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .nav-refresh-btn {
            background: var(--accent2);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .nav-refresh-btn:hover:not(:disabled) { background: var(--surface2); }
        .nav-refresh-btn:disabled { opacity: 0.6; cursor: default; }
        .nav-refresh-msg { font-size: 0.8rem; color: var(--green); max-width: 260px; }
        .nav-refresh-msg.error { color: var(--accent); }

        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--surface);
            padding: 1.2rem;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card .number { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
        .stat-card .label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; }

        .section-title {
            font-size: 1.3rem;
            margin: 2rem 0 1rem;
            color: var(--text);
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
        }
        .media-card {
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .media-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .media-card a { color: inherit; }
        .media-card .poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: var(--surface2);
            display: block;
        }
        .media-card .no-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 2rem;
        }
        .media-card .info {
            padding: 0.8rem;
        }
        .media-card .info h3 {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-card .info .meta {
            font-size: 0.8rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            margin-top: 0.3rem;
        }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-movie { background: var(--accent2); color: #7ec8e3; }
        .badge-series { background: #1b4332; color: var(--green); }
        .badge-unknown { background: #333; color: #999; }

        .rating {
            color: var(--yellow);
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            background: var(--accent2);
            color: var(--text);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            margin: 0.15rem;
        }
        .tag-genre { background: #2d1b4e; color: #c39bd3; }
        .tag-resolution { background: #1b3a4b; color: #89cff0; }

        .filters {
            background: var(--surface);
            padding: 1rem 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
        }
        .filters select, .filters input {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .filters label {
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .filters button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .pagination a, .pagination span {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .pagination a { background: var(--surface); color: var(--text); }
        .pagination a:hover { background: var(--accent2); text-decoration: none; }
        .pagination .current { background: var(--accent); color: white; }

        .detail-header {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .detail-header .poster-large {
            width: 300px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .detail-header .info { flex: 1; }
        .detail-header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .detail-header .tagline { color: var(--text-dim); font-style: italic; margin-bottom: 1rem; }
        .detail-header .overview { margin: 1rem 0; line-height: 1.8; }

        .detail-meta {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .detail-meta dt { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; }
        .detail-meta dd { font-size: 1rem; margin-bottom: 0.8rem; }

        .file-info {
            background: var(--surface);
            padding: 1.2rem;
            border-radius: 10px;
            margin: 1.5rem 0;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            word-break: break-all;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        th, td {
            text-align: left;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; }
        tr:hover { background: var(--surface); }

        .dupe-group {
            background: var(--surface);
            border-radius: 10px;
            padding: 1.2rem;
            margin-bottom: 1rem;
        }
        .dupe-group h3 { margin-bottom: 0.5rem; }
        .dupe-group .paths {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .dupe-group .paths li {
            list-style: none;
            padding: 0.3rem 0;
            display: flex;
            justify-content: space-between;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-dim);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

        /* Universal path controls: hide server-only actions (VLC / Reveal)
           when the browser is not running on the server Mac itself. */
        html.mc-remote .server-only { display: none !important; }
        .local-vlc-only { display: none !important; }
        html.mc-remote.mc-local-vlc .local-vlc-only { display: inline-flex !important; }

        .mc-toast {
            position: fixed; bottom: 1.5rem; left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--surface2); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 0.6rem 1.2rem; font-size: 0.82rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 500; max-width: 80vw; word-break: break-all;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .mc-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .mc-toast.error { border-color: var(--accent); color: var(--accent); }

        .mc-path-menu {
            position: absolute; background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 0.3rem; z-index: 400;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            min-width: 260px; max-width: min(440px, 90vw);
        }
        .mc-path-menu button {
            display: block; width: 100%; text-align: left;
            background: none; border: none; color: var(--text);
            padding: 0.45rem 0.6rem; border-radius: 6px;
            cursor: pointer; font-size: 0.85rem;
        }
        .mc-path-menu button:hover { background: var(--surface2); }
        .mc-path-menu button small {
            display: block; color: var(--text-dim);
            font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.7rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .mc-default-tag { color: var(--green); font-size: 0.7rem; margin-left: 0.5rem; }

        /* Favourites: star toggle + tag membership dropdown */
        .mc-star {
            background: none; border: 1px solid transparent; cursor: pointer;
            font-size: 1rem; line-height: 1; color: var(--text-dim);
            padding: 0.15rem 0.3rem; border-radius: 4px; flex: 0 0 auto;
        }
        .mc-star:hover { color: var(--yellow); }
        .mc-star.starred { color: var(--yellow); }

        /* Card action buttons (cards on every grid page; detail pages restyle them) */
        .card-actions { display: flex; gap: 0.3rem; padding: 0.4rem 0.5rem; }
        .card-btn { flex: 1; font-size: 0.7rem; padding: 0.25rem 0; background: var(--surface); border: 1px solid #444; color: var(--text-dim); border-radius: 4px; cursor: pointer; }
        .card-btn:hover { color: var(--text); border-color: #888; }
        .mc-tag-menu { min-width: 200px; max-height: 320px; overflow-y: auto; }
        .mc-tag-menu .mc-tag-empty {
            color: var(--text-dim); font-size: 0.78rem; padding: 0.45rem 0.6rem;
        }
        .mc-tag-row .mc-tag-tick {
            visibility: hidden; color: var(--green); margin-right: 0.45rem; font-weight: 700;
        }
        .mc-tag-row.applied .mc-tag-tick { visibility: visible; }
        .mc-tag-new { border-top: 1px solid var(--border) !important; margin-top: 0.2rem; color: var(--accent) !important; }

        .fav-pills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
        .fav-pill {
            display: inline-block; padding: 0.3rem 0.9rem; border-radius: 16px;
            font-size: 0.85rem; background: var(--surface); color: var(--text-dim);
            border: 1px solid var(--border);
        }
        .fav-pill:hover { color: var(--text); text-decoration: none; }
        .fav-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

        @media (max-width: 768px) {
            nav { flex-wrap: wrap; gap: 1rem; }
            .search-bar { margin-left: 0; width: 100%; }
            .search-bar input { flex: 1; }
            .detail-header { flex-direction: column; }
            .detail-header .poster-large { width: 100%; max-width: 300px; }
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <nav>
        <span class="logo">{% block logo %}🎬 Media Catalog{% endblock %}</span>
        {% block nav_links %}
        <a href="/">Dashboard</a>
        <a href="/browse">Browse</a>
        <a href="/series">Series</a>
        <a href="/favourites">Favourites</a>
        <a href="/duplicates">Duplicates</a>
        <a href="/browse?unenriched=1">Unenriched</a>
        <a href="/books" title="Ebook library">📚 Books</a>
        {% endblock %}
        <a class="local-vlc-only" href="/local-vlc" title="One-time setup for opening the selected network URI in VLC on this computer">Local VLC setup</a>
        <form class="search-bar" action="{% block search_action %}/browse{% endblock %}" method="get">
            <input type="text" name="q" placeholder="{% block search_placeholder %}Search titles, plots, directors...{% endblock %}" value="{{ request.query_params.get('q', '') }}">
            <button type="submit">Search</button>
        </form>
        <button id="nav-refresh-btn" class="nav-refresh-btn" {% block refresh_attrs %}title="Rescan media folders and refresh metadata from OMDb"{% endblock %}>{% block refresh_label %}⟳ Refresh{% endblock %}</button>
        <span id="nav-refresh-msg" class="nav-refresh-msg"></span>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
    // ── Universal open: path mapping + clipboard for any LAN client ────────
    window.MC = (function () {
        const KIND_LABEL = { unc: 'Windows path', smb: 'smb:// URL', mac: 'Mac path' };

        // whoami: is this browser running on the server Mac itself?
        // Cached in sessionStorage so server-only buttons don't flash on nav.
        let whoami = null;
        try { whoami = JSON.parse(sessionStorage.getItem('mc_whoami') || 'null'); } catch (e) {}
        function applyWhoami() {
            if (whoami) document.documentElement.classList.toggle('mc-remote', !whoami.is_server_host);
        }
        applyWhoami();
        fetch('/api/whoami').then(r => r.json()).then(w => {
            whoami = w;
            try { sessionStorage.setItem('mc_whoami', JSON.stringify(w)); } catch (e) {}
            applyWhoami();
        }).catch(() => {});

        let mappingsPromise = null;
        function mappings() {
            if (!mappingsPromise) {
                mappingsPromise = fetch('/api/path-mappings')
                    .then(r => r.json()).then(b => b.mappings || {})
                    .catch(() => { mappingsPromise = null; return {}; });
            }
            return mappingsPromise;
        }

        function clientOS() {
            const p = ((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '') + ' ' + navigator.userAgent;
            if (/windows|win32|win64/i.test(p)) return 'windows';
            if (/mac/i.test(p)) return 'mac';
            return 'other';
        }

        document.documentElement.classList.toggle(
            'mc-local-vlc', clientOS() === 'windows' || clientOS() === 'mac'
        );

        function defaultKind() {
            const os = clientOS();
            if (os === 'windows') return 'unc';
            if (os === 'mac') return (whoami && whoami.is_server_host) ? 'mac' : 'smb';
            return 'smb';
        }

        function legacyCopy(text) {
            // Fallback for http:// LAN pages, where navigator.clipboard is unavailable.
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            return ok;
        }

        function toast(msg, isError) {
            let t = document.getElementById('mc-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'mc-toast';
                t.className = 'mc-toast';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.classList.toggle('error', !!isError);
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2800);
        }

        function copyText(text, label) {
            const shown = text.length > 90 ? text.slice(0, 87) + '…' : text;
            const done = () => toast('✓ Copied ' + (label ? label + ': ' : '') + shown);
            const fail = () => toast('Copy failed — path: ' + shown, true);
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done, () => (legacyCopy(text) ? done() : fail()));
            } else {
                legacyCopy(text) ? done() : fail();
            }
        }

        // Client-side twin of app.py map_path(), for buttons that carry a
        // raw directory (data-dir) instead of an entry id.
        function mapLocal(path, maps) {
            const variants = { mac: path };
            const prefixes = Object.keys(maps).sort((a, b) => b.length - a.length);
            for (const raw of prefixes) {
                const prefix = raw.replace(/\/+$/, '');
                if (path !== prefix && !path.startsWith(prefix + '/')) continue;
                const rest = path.slice(prefix.length);
                const t = maps[raw] || {};
                if (t.smb) variants.smb = t.smb.replace(/\/+$/, '') + rest.split('/').map(encodeURIComponent).join('/');
                if (t.unc) variants.unc = t.unc.replace(/\\+$/, '') + rest.split('/').join('\\');
                break;
            }
            return variants;
        }

        function pickVariant(variants, kind) {
            const k = kind || defaultKind();
            if (variants[k]) return { kind: k, text: variants[k] };
            if (variants.smb) return { kind: 'smb', text: variants.smb };
            return { kind: 'mac', text: variants.mac };
        }

        function fetchPaths(id) {
            return fetch('/api/paths/' + id).then(r => {
                if (!r.ok) throw new Error('paths ' + r.status);
                return r.json();
            });
        }

        function copyEntryPath(id, kind) {
            fetchPaths(id).then(p => {
                const v = pickVariant(p.variants, kind);
                copyText(v.text, KIND_LABEL[v.kind]);
            }).catch(() => toast('Could not fetch path for entry ' + id, true));
        }

        function copyLocalPath(path, kind) {
            mappings().then(maps => {
                const v = pickVariant(mapLocal(path, maps), kind);
                copyText(v.text, KIND_LABEL[v.kind]);
            });
        }

        function closeMenu() {
            const m = document.getElementById('mc-path-menu');
            if (m) m.remove();
        }

        function showMenu(anchor, variants) {
            closeMenu();
            const menu = document.createElement('div');
            menu.id = 'mc-path-menu';
            menu.className = 'mc-path-menu';
            const def = defaultKind();
            ['unc', 'smb', 'mac'].forEach(kind => {
                if (!variants[kind]) return;
                const item = document.createElement('button');
                item.type = 'button';
                const title = document.createElement('span');
                title.textContent = KIND_LABEL[kind];
                if (kind === def) {
                    const tag = document.createElement('span');
                    tag.className = 'mc-default-tag';
                    tag.textContent = 'default';
                    title.appendChild(tag);
                }
                const sub = document.createElement('small');
                sub.textContent = variants[kind];
                item.appendChild(title);
                item.appendChild(sub);
                item.addEventListener('click', ev => {
                    ev.preventDefault();
                    ev.stopPropagation();
                    copyText(variants[kind], KIND_LABEL[kind]);
                    closeMenu();
                });
                menu.appendChild(item);
            });
            document.body.appendChild(menu);
            const r = anchor.getBoundingClientRect();
            const left = Math.min(r.left + window.scrollX,
                window.scrollX + document.documentElement.clientWidth - menu.offsetWidth - 8);
            menu.style.top = (r.bottom + window.scrollY + 4) + 'px';
            menu.style.left = Math.max(8, left) + 'px';
            setTimeout(() => {
                document.addEventListener('click', function h() {
                    closeMenu();
                    document.removeEventListener('click', h);
                });
            }, 0);
        }

        function pathMenu(btn) {
            if (document.getElementById('mc-path-menu')) { closeMenu(); return; }
            if (btn.dataset.id) {
                fetchPaths(btn.dataset.id)
                    .then(p => showMenu(btn, p.variants))
                    .catch(() => toast('Could not fetch path', true));
            } else if (btn.dataset.dir) {
                mappings().then(maps => showMenu(btn, mapLocal(btn.dataset.dir, maps)));
            }
        }

        return { clientOS, defaultKind, copyText, copyEntryPath, copyLocalPath, pathMenu, toast, mappings, mapLocal };
    })();

    // Global handlers for inline onclick / oncontextmenu on entry buttons.
    function mcCopyPath(e, btn) { e.preventDefault(); e.stopPropagation(); MC.copyEntryPath(btn.dataset.id); }
    function mcCopyDir(e, btn) { e.preventDefault(); e.stopPropagation(); MC.copyLocalPath(btn.dataset.dir); }
    function mcPathMenu(e, btn) { e.preventDefault(); e.stopPropagation(); MC.pathMenu(btn); }
    function mcOpenLocalVlc(e, btn) {
        e.preventDefault(); e.stopPropagation();
        const original = btn.textContent;
        btn.textContent = 'Opening…';
        window.location.assign('/api/open-local-vlc/' + encodeURIComponent(btn.dataset.id));
        window.setTimeout(() => { btn.textContent = original; }, 1800);
    }

    // ── Favourites: star toggle + tag membership dropdown ──────────────────
    // Starring is independent of tags; applying a tag auto-stars the entry
    // (the server enforces this and mcApplyTag syncs the star UI back).
    function mcSetStar(id, starred) {
        document.querySelectorAll('.mc-star[data-id="' + id + '"]').forEach(function (b) {
            b.classList.toggle('starred', !!starred);
            b.textContent = starred ? '★' : '☆';
            b.title = starred ? 'Unstar — remove from Favourites' : 'Star — add to Favourites';
        });
    }

    // Star and tag buttons name their entry API with data-api (default: movies).
    function mcApi(el) { return (el && el.dataset.api) || '/api/media'; }

    function mcToggleStar(e, btn) {
        e.preventDefault(); e.stopPropagation();
        var id = btn.dataset.id;
        var was = btn.classList.contains('starred');
        mcSetStar(id, !was);  // optimistic
        fetch(mcApi(btn) + '/' + id + '/star', { method: was ? 'DELETE' : 'POST' })
            .then(function (r) { if (!r.ok) throw new Error('star ' + r.status); return r.json(); })
            .then(function (s) { mcSetStar(id, s.starred); })
            .catch(function () { mcSetStar(id, was); MC.toast('Could not update favourite', true); });
    }

    function mcApplyTag(id, tagId, apply, api) {
        return fetch((api || '/api/media') + '/' + id + '/tags/' + tagId, { method: apply ? 'POST' : 'DELETE' })
            .then(function (r) { if (!r.ok) throw new Error('tag update ' + r.status); return r.json(); })
            .then(function (s) { mcSetStar(id, s.starred); return s; });
    }

    function mcCloseTagMenu() {
        var m = document.getElementById('mc-tag-menu');
        if (m) m.remove();
    }

    function mcTagRow(id, t, api) {
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'mc-tag-row' + (t.applied ? ' applied' : '');
        var tick = document.createElement('span');
        tick.className = 'mc-tag-tick';
        tick.textContent = '✓';
        row.appendChild(tick);
        row.appendChild(document.createTextNode(t.name));
        row.addEventListener('click', function (ev) {
            ev.preventDefault(); ev.stopPropagation();
            var applying = !row.classList.contains('applied');
            row.classList.toggle('applied', applying);  // optimistic
            mcApplyTag(id, t.id, applying, api).catch(function () {
                row.classList.toggle('applied', !applying);
                MC.toast('Could not update tag', true);
            });
        });
        return row;
    }

    function mcRenderTagMenu(anchor, id, tags) {
        mcCloseTagMenu();
        var menu = document.createElement('div');
        menu.id = 'mc-tag-menu';
        menu.className = 'mc-path-menu mc-tag-menu';
        if (!tags.length) {
            var empty = document.createElement('div');
            empty.className = 'mc-tag-empty';
            empty.textContent = 'No tags yet';
            menu.appendChild(empty);
        }
        var api = mcApi(anchor);
        tags.forEach(function (t) { menu.appendChild(mcTagRow(id, t, api)); });
        var add = document.createElement('button');
        add.type = 'button';
        add.className = 'mc-tag-new';
        add.textContent = '+ New tag…';
        add.addEventListener('click', function (ev) {
            ev.preventDefault(); ev.stopPropagation();
            var name = prompt('New tag name:');
            if (!name || !name.trim()) return;
            fetch('/api/tags', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name.trim() }),
            })
                .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
                .then(function (res) {
                    var tag = res.body.tag;  // present on 201 (created) and 409 (existing)
                    if (!tag) throw new Error(res.body.error || 'could not create tag');
                    return mcApplyTag(id, tag.id, true, api).then(function () {
                        MC.toast((res.status === 201 ? '✓ Created and applied "' : '✓ Applied existing "') + tag.name + '"');
                        mcCloseTagMenu();
                    });
                })
                .catch(function (err) { MC.toast(err.message || 'Tag create failed', true); });
        });
        menu.appendChild(add);
        document.body.appendChild(menu);
        var r = anchor.getBoundingClientRect();
        var left = Math.min(r.left + window.scrollX,
            window.scrollX + document.documentElement.clientWidth - menu.offsetWidth - 8);
        menu.style.top = (r.bottom + window.scrollY + 4) + 'px';
        menu.style.left = Math.max(8, left) + 'px';
        setTimeout(function () {
            document.addEventListener('click', function h(ev) {
                if (menu.contains(ev.target)) return;  // keep open while toggling ticks
                mcCloseTagMenu();
                document.removeEventListener('click', h);
            });
        }, 0);
    }

    function mcTagMenu(e, btn) {
        e.preventDefault(); e.stopPropagation();
        if (document.getElementById('mc-tag-menu')) { mcCloseTagMenu(); return; }
        var url = btn.dataset.api ? btn.dataset.api + '/' + btn.dataset.id + '/tags'
                                  : '/api/tags?media_id=' + btn.dataset.id;
        fetch(url)
            .then(function (r) { if (!r.ok) throw new Error('tags ' + r.status); return r.json(); })
            .then(function (data) { mcRenderTagMenu(btn, btn.dataset.id, data.tags); })
            .catch(function () { MC.toast('Could not load tags', true); });
    }

    // ── Card actions: open on the server Mac, reveal, copy link ────────────
    // Show a short result on the button, then restore its original label.
    function mcFlash(btn, text, isError, ms) {
        if (!btn.dataset.label) btn.dataset.label = btn.textContent;
        btn.textContent = text;
        btn.style.color = isError ? '#f66' : '';
        clearTimeout(btn._mcFlash);
        btn._mcFlash = setTimeout(function () { btn.textContent = btn.dataset.label; btn.style.color = ''; }, ms || 3000);
    }

    // POST an open/reveal endpoint. Without an `open` command on the server,
    // copy the file path (or its folder when copyDir) for the user instead.
    function mcOpenAction(e, btn, url, okText, copyDir) {
        e.preventDefault();
        fetch(url, { method: 'POST' }).then(function (r) { return r.json(); }).then(function (data) {
            if (data.error === 'no_open_cmd' && data.file_path) {
                var p = copyDir ? data.file_path.substring(0, data.file_path.lastIndexOf('/')) : data.file_path;
                MC.copyText(p, copyDir ? 'folder' : 'path');
                mcFlash(btn, copyDir ? 'Dir copied' : 'Path copied');
            } else if (data.error) {
                mcFlash(btn, data.error, true);
            } else {
                mcFlash(btn, okText);
            }
        }).catch(function () { mcFlash(btn, 'Failed', true); });
    }
    function openVlc(e, btn) { mcOpenAction(e, btn, '/api/open/' + btn.dataset.id, btn.dataset.ok || '▶ Playing'); }
    function revealInFinder(e, btn) { mcOpenAction(e, btn, '/api/reveal/' + btn.dataset.id, btn.dataset.ok || '✓ Opened', true); }
    function copyLink(e, btn) {
        e.preventDefault();
        MC.copyText(btn.dataset.url, 'link');
        mcFlash(btn, 'Copied!', false, 1500);
    }
    </script>

    <script>
    (function () {
        const btn = document.getElementById('nav-refresh-btn');
        const msg = document.getElementById('nav-refresh-msg');
        // Book pages point the button at their own job via data-start / data-status.
        const startUrl = btn.dataset.start || '/api/refresh';
        const statusUrl = btn.dataset.status || '/api/refresh/status';
        const idleLabel = btn.dataset.label || '⟳ Refresh';
        const stageLabel = { scan: 'Scanning…', enrich: 'Enriching…', resolve: 'Resolving…' };
        let timer = null;

        function setRunning(stage) {
            btn.disabled = true;
            btn.textContent = stageLabel[stage] || 'Refreshing…';
        }
        function setIdle(text, isError) {
            btn.disabled = false;
            btn.textContent = idleLabel;
            msg.textContent = text || '';
            msg.className = 'nav-refresh-msg' + (isError ? ' error' : '');
            if (text) setTimeout(function () {
                if (msg.textContent === text) msg.textContent = '';
            }, 15000);
        }
        function startPolling() {
            if (!timer) timer = setInterval(function () { poll(true); }, 3000);
        }
        function stopPolling() {
            if (timer) { clearInterval(timer); timer = null; }
        }
        async function poll(showResult) {
            try {
                const r = await fetch(statusUrl);
                const s = await r.json();
                if (s.running) {
                    setRunning(s.stage);
                    startPolling();
                } else {
                    stopPolling();
                    if (showResult && s.last_result) {
                        setIdle((s.last_result.ok ? '✓ ' : '✗ ') + s.last_result.summary, !s.last_result.ok);
                    } else {
                        setIdle('');
                    }
                }
            } catch (e) { /* transient (e.g. server reload) — next poll retries */ }
        }
        btn.addEventListener('click', async function () {
            btn.disabled = true;
            msg.textContent = '';
            try {
                const r = await fetch(startUrl, { method: 'POST' });
                const body = await r.json();
                if (r.status === 409) {
                    msg.textContent = 'Refresh already running';
                } else if (!r.ok) {
                    setIdle('✗ ' + (body.error || 'refresh failed'), true);
                    return;
                }
                poll(true);
                startPolling();
            } catch (e) {
                setIdle('✗ ' + e, true);
            }
        });
        poll(false);  // pick up an already-running refresh on page load
    })();
    </script>
